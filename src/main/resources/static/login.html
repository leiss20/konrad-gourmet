
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Ingresar · Konrad Gourmet</title>

    <style>
        /* ========================================
           1. VARIABLES Y CONFIGURACIÓN GENERAL
        ======================================== */

        :root {
            --mag: #d6006b;
            --mor: #6c2a8c;
            --roj: #c9183d;
            --ver: #1f8a5b;
            --lim: #b7d500;
            --tea: #4e9a9a;

            --tx: #3c3c3b;
            --mu: #7a7a7a;
            --bd: #e8e8e8;
            --sf: #f6f6f7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
            color: var(--tx);
            background: #fff;
        }


        /* ========================================
           2. FRANJA SUPERIOR MULTICOLOR
        ======================================== */

        .stripe {
            height: 5px;
            background: linear-gradient(
                90deg,
                var(--mag) 0 20%,
                var(--mor) 0 40%,
                var(--roj) 0 55%,
                var(--ver) 0 70%,
                var(--lim) 0 85%,
                var(--tea) 0
            );
        }


        /* ========================================
           3. CONTENEDOR PRINCIPAL
        ======================================== */

        .box {
            max-width: 380px;
            margin: 9vh auto;
            padding: 30px;
            border: 1px solid var(--bd);
            border-radius: 16px;
        }


        /* ========================================
           4. LOGOTIPO Y NOMBRE
        ======================================== */

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .logo b {
            display: block;
            font-size: 19px;
        }

        .logo small {
            font-size: 10px;
            color: var(--mu);
        }


        /* ========================================
           5. CAMPOS DEL FORMULARIO
        ======================================== */

        input {
            width: 100%;
            font: inherit;
            padding: 10px 12px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            margin-bottom: 12px;
        }


        /* ========================================
           6. BOTÓN DE INGRESO
        ======================================== */

        button {
            width: 100%;
            font: inherit;
            border: 0;
            border-radius: 10px;
            padding: 11px;
            background: var(--mag);
            color: #fff;
            cursor: pointer;
        }


        /* ========================================
           7. MENSAJES Y AYUDA
        ======================================== */

        .err {
            color: var(--roj);
            margin-bottom: 10px;
        }

        .hint {
            color: var(--mu);
            font-size: 12px;
            margin-top: 16px;
        }
    </style>
</head>

<body>

    <!-- ========================================
         8. FRANJA SUPERIOR
    ======================================== -->

    <div class="stripe"></div>


    <!-- ========================================
         9. CONTENEDOR DEL INICIO DE SESIÓN
    ======================================== -->

    <div class="box">

        <!-- LOGOTIPO -->

        <div class="logo">

            <svg width="38" height="38" viewBox="0 0 100 100">

                <polygon
                    points="6,4 30,4 30,96 6,96"
                    fill="#d6006b"
                />

                <polygon
                    points="6,4 30,4 30,50 6,50"
                    fill="#6c2a8c"
                />

                <polygon
                    points="6,50 30,50 30,96 6,96"
                    fill="#c9183d"
                />

                <polygon
                    points="30,50 54,26 54,74"
                    fill="#1f8a5b"
                />

                <polygon
                    points="30,50 72,4 98,4 54,52"
                    fill="#b7d500"
                />

                <polygon
                    points="54,52 98,96 70,96 30,50"
                    fill="#4e9a9a"
                />

            </svg>

            <div>
                <b>KONRAD GOURMET</b>
                <small>FUNDACIÓN UNIVERSITARIA KONRAD LORENZ</small>
            </div>

        </div>


        <!-- MENSAJE DE ERROR -->

        <div class="err" id="e"></div>


        <!-- ========================================
             10. FORMULARIO DE AUTENTICACIÓN
        ======================================== -->

        <form method="post" action="/login">
            
            <input type="hidden" name="_csrf" id="x">

            <input
                name="username"
                type="email"
                placeholder="Correo"
                required
            >

            <input
                name="password"
                type="password"
                placeholder="Contraseña"
                required
            >

            <button type="submit">
                Ingresar
            </button>

        </form>


        <!-- ========================================
             11. INFORMACIÓN DE USUARIOS DE PRUEBA
        ======================================== -->

        <div class="hint">
            Usuarios de prueba (clave Konrad2026):
            jefe@, mesero@, auxiliar@, dircompras@,
            dircomercial@ y admin@konrad.co
        </div>

    </div>


    <!-- ========================================
         12. VALIDACIÓN DE MENSAJES
    ======================================== -->

    <script>

        // Comprueba si el inicio de sesión presentó un error
        function mostrarErrorLogin() {

            const parametros = window.location.search;
            const mensaje = document.getElementById('e');

            if (parametros.includes('error')) {
                mensaje.textContent =
                    'Correo o contraseña incorrectos.';
            }
        }


        // Inicialización de la página
        document.addEventListener('DOMContentLoaded', () => {
            mostrarErrorLogin();
        });
        document.getElementById('x').value=decodeURIComponent((document.cookie.match(/XSRF-TOKEN=([^;]+)/)||[])[1]||'');

    </script>

</body>
</html>
